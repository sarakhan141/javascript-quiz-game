<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeMaster Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>CodeMaster JavaScript Quiz</h1>

    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
